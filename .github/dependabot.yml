version: 2
updates:

  # extension
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[extension]"
    assignees:
      - "alexey-max-fedorov"
    ignore:
      # TypeScript 7 is an ESM-only rewrite that dropped the classic
      # lib/typescript.js CJS entry Next.js 16 requires, which breaks
      # Vercel's build (see commit ff02942). Stay on the 6.x line until
      # Next.js/Vercel support TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # website
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[website]"
    assignees:
      - "alexey-max-fedorov"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[Actions]"
    assignees:
      - "alexey-max-fedorov"
